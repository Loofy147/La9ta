name: La9ta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run domain and security contract tests
        run: npm test
      - name: Validate JSON manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('src/catalog.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('src/package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('src/manifest.webmanifest','utf8'))"
